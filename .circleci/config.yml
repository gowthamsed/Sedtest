version: 2.1
 
orbs:
  cicd: sedstart/cicd@1.0.1
jobs:
  run-sedstart-cloud:
    docker:
      - image: cimg/node:25.2.1
    steps:
      - cicd/runcloud:    
          api_key: SEDSTART_API_KEY     
          project_id: 561
          test_id: 4580
          profile_id: 1172
          browser: chrome
          headless: true
workflows:
  test-workflow:
    jobs:
      - run-sedstart-cloud
